<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration-color:var(--red);text-underline-offset:3px;text-decoration-thickness:1.5px}
a:hover{color:var(--red)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.nav a{text-decoration:none}
.nav a:hover{text-decoration:underline}
.solid:hover{background:var(--red)!important;border-color:var(--red)!important;color:var(--redink)!important}
.line:hover,.ghost:hover{background:var(--ink)!important;color:var(--paper)!important}
.tabbtn:hover{background:var(--grid)}
.linkrow:hover{background:var(--ink);color:var(--paper)}
.shot:hover img{opacity:.92}
.card{transition:transform .18s ease, box-shadow .18s ease}
.card:hover{transform:translateY(-3px); box-shadow:5px 5px 0 var(--red)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.grow{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-origin:left center;transform-box:fill-box;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
@keyframes pulseA{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes pulseB{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.pulseA{animation:pulseA .7s .75s ease-out both}
.pulseB{animation:pulseB .7s .75s ease-out both}
.cursor{transition:top .7s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.bar,.grow,.pulseA,.pulseB{animation:none}.cursor{transition:none}}
@media (max-width:760px){.flow{flex-direction:column!important}.link svg{transform:rotate(90deg)}.big{font-size:40px!important}.sat{display:none!important}.side{flex-basis:100%!important;border-right:0!important;border-bottom:1px solid var(--line)}.cursor{display:none!important}}
</style>

<body>
<div id="app"></div>
<template id="tpl">


<div onMouseMove="{{onSpot}}" style="{{rootStyle}} min-height:100%; background-color:var(--paper); background-image:radial-gradient(380px circle at var(--mx,50%) var(--my,10%), var(--glow), transparent 70%), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:100% 100%, 28px 28px, 28px 28px; color:var(--ink); font-family:'Public Sans', system-ui, sans-serif; font-size:16px; line-height:1.6; padding-bottom:48px">
<div style="max-width:1080px; margin:0 auto; padding:0 24px">

<!-- top bar -->
<header style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding:18px 0; border-bottom:1.5px solid var(--ink)">
  <a id="top" href="#top" style="font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.1em; text-transform:uppercase; text-decoration:none">H. M. Adel<span style="color:var(--red)">/</span>software</a>
  <nav class="nav" aria-label="Sections" style="display:flex; flex-wrap:wrap; align-items:center; gap:6px 20px">
    <a href="#projects" style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase">Projects</a>
    <a href="#skills" style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase">Skills</a>
    <a href="#education" style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase">Education</a>
    <a href="#certificates" style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase">Certificates</a>
    <a href="#workshops" style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase">Workshops</a>
    <a href="#contact" style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase">Contact</a>
    <button class="ghost" type="button" onClick="{{toggleTheme}}" style="font:500 11px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; background:transparent; color:var(--ink); border:1.5px solid var(--ink); padding:10px 12px; min-height:40px; cursor:pointer">{{themeLabel}}</button>
  </nav>
</header>

<!-- hero -->
<section style="display:flex; flex-wrap:wrap; gap:40px; padding:56px 0 48px; align-items:flex-start">
  <div style="flex:1 1 440px; min-width:0">
    <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2)">Portfolio / Dhaka, Bangladesh</span>
    <h1 class="big" style="margin:14px 0 0; font-family:'Big Shoulders Display','Arial Narrow',sans-serif; font-weight:800; text-transform:uppercase; line-height:.95; font-size:104px; text-wrap:balance">Hamed Mohammed <span style="color:var(--red)">Adel</span></h1>
    <p style="margin:20px 0 0; font-family:'IBM Plex Mono',monospace; font-size:15px">I build <button type="button" onClick="{{nextWord}}" aria-label="Show another thing I build" style="display:inline-block; min-width:15ch; text-align:left; font:600 15px/1.2 'IBM Plex Mono',monospace; background:transparent; color:var(--red); border:0; border-bottom:2px dashed var(--red); padding:6px 2px; min-height:32px; cursor:pointer">{{word}}</button> <span style="color:var(--ink2); font-size:12px">(click me)</span></p>
    <p style="max-width:52ch; font-size:18px; margin:18px 0 0">I build desktop and web applications in C#, ASP.NET, Java and Python (Django). I study Computer Science and Engineering at AIUB, graduating in May 2027, with coursework in machine learning, natural language processing and computer vision.</p>
    <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:28px">
      <a class="solid" href="#projects" style="display:inline-block; font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; text-decoration:none; padding:16px 18px; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper)">See the projects</a>
      <a class="line" href="https://github.com/adel141" target="_blank" rel="noopener" style="display:inline-block; font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; text-decoration:none; padding:16px 18px; border:1.5px solid var(--ink); color:var(--ink)">GitHub / adel141</a>
    </div>
  </div>

  <div style="flex:1 1 380px; min-width:0; position:relative; background:var(--sheet); border:1.5px solid var(--ink)">
    <div aria-label="Terminal showing a short summary of my work" role="img" style="border-bottom:1.5px solid var(--ink); background:var(--ink); color:var(--paper)">
      <div style="display:flex; align-items:center; gap:10px; padding:0 12px; height:32px; border-bottom:1px solid var(--line)">
        <span aria-hidden="true" style="display:flex; gap:6px"><span style="width:9px; height:9px; border:1.5px solid var(--paper)"></span><span style="width:9px; height:9px; border:1.5px solid var(--paper)"></span><span style="width:9px; height:9px; background:var(--red); border:1.5px solid var(--red)"></span></span>
        <span style="flex:1; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; opacity:.75">adel141 / ~</span>
        <span style="width:40px"></span>
      </div>
      <div aria-hidden="true" style="height:176px; overflow:hidden; padding:12px 14px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; line-height:1.55">
        <template data-sc="for" list="{{term}}" as="l" hint-placeholder-count="8">
          <div style="white-space:pre-wrap; overflow-wrap:anywhere; color:{{l.color}}; min-height:19px">{{l.t}}</div>
        </template>
      </div>
    </div>
    <dl style="margin:0; display:grid; grid-template-columns:minmax(0,1fr); gap:1px; background:var(--line)">
      <div style="background:var(--sheet); display:flex; gap:12px; padding:10px 14px; align-items:baseline"><dt style="flex:0 0 104px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2)">Role</dt><dd style="margin:0; font-size:14.5px; min-width:0">Software developer</dd></div>
      <div style="background:var(--sheet); display:flex; gap:12px; padding:10px 14px; align-items:baseline"><dt style="flex:0 0 104px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2)">Stack</dt><dd style="margin:0; font-size:14.5px; min-width:0">C#, ASP.NET, Java, Python (Django), SQL Server</dd></div>
      <div style="background:var(--sheet); display:flex; gap:12px; padding:10px 14px; align-items:baseline"><dt style="flex:0 0 104px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2)">Studying</dt><dd style="margin:0; font-size:14.5px; min-width:0">B.Sc. Computer Science and Engineering, American International University-Bangladesh</dd></div>
      <div style="background:var(--sheet); display:flex; gap:12px; padding:10px 14px; align-items:baseline"><dt style="flex:0 0 104px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2)">Coursework</dt><dd style="margin:0; font-size:14.5px; min-width:0">Machine Learning, NLP, Computer Vision and Pattern Recognition</dd></div>
      <div style="background:var(--sheet); display:flex; gap:12px; padding:10px 14px; align-items:baseline"><dt style="flex:0 0 104px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2)">Honours</dt><dd style="margin:0; font-size:14.5px; min-width:0">Dean's Award, three semesters</dd></div>
      <div style="background:var(--sheet); display:flex; gap:12px; padding:10px 14px; align-items:baseline"><dt style="flex:0 0 104px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2)">Graduation</dt><dd style="margin:0; font-size:14.5px; min-width:0">May 2027 (expected)</dd></div>
    </dl>
    <div style="padding:14px 14px 8px; border-top:1.5px solid var(--ink)">
      <svg viewBox="0 0 480 96" role="img" aria-label="CGPA 3.94 on a scale of 0 to 4.00" style="display:block; width:100%; height:auto">
        <g style="stroke:var(--ink); stroke-width:1; fill:none">
          <line x1="20" y1="14" x2="20" y2="46"/><line x1="453.4" y1="14" x2="453.4" y2="46"/><line x1="24" y1="26" x2="449.4" y2="26"/>
        </g>
        <polygon points="20,26 30,22 30,30" style="fill:var(--ink)"/>
        <polygon points="453.4,26 443.4,22 443.4,30" style="fill:var(--ink)"/>
        <text x="236" y="20" text-anchor="middle" style="font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500; fill:var(--ink)">CGPA 3.94</text>
        <rect x="20" y="46" width="440" height="14" style="fill:none; stroke:var(--line); stroke-width:1"/>

(function(){

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escA(t){return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
function look(path,scope){var parts=path.trim().split('.');var v=parts[0] in scope?scope[parts[0]]:undefined;for(var i=1;i<parts.length&&v!=null;i++)v=v[parts[i]];return v;}
var handlers={},hid=0;
function interp(str,scope){return str.replace(/\{\{([^}]+)\}\}/g,function(_,e){var v=look(e,scope);return v==null?'':String(v);});}
function single(str){var m=/^\s*\{\{([^}]+)\}\}\s*$/.exec(str);return m?m[1]:null;}
function walk(node,scope){
  if(node.nodeType===3)return esc(interp(node.nodeValue,scope));
  if(node.nodeType!==1)return '';
  var tag=node.tagName.toLowerCase(),out='';
  if(tag==='template'){
    var kind=node.getAttribute('data-sc');
    var kids=Array.prototype.slice.call(node.content.childNodes);
    if(kind==='for'){
      var list=look(single(node.getAttribute('list')),scope)||[],as=node.getAttribute('as');
      list.forEach(function(item){var sc=Object.create(scope);sc[as]=item;kids.forEach(function(k){out+=walk(k,sc);});});
    } else if(kind==='if'){
      if(look(single(node.getAttribute('value')),scope))kids.forEach(function(k){out+=walk(k,scope);});
    }
    return out;
  }
  var attrs='';
  Array.prototype.forEach.call(node.attributes,function(a){
    var n=a.name;
    if(n.indexOf('hint-')===0)return;
    if(/^on/.test(n)&&single(a.value)){var fn=look(single(a.value),scope);if(typeof fn==='function'){var id=++hid;handlers[id]=fn;attrs+=' data-h-'+n.slice(2).toLowerCase()+'="'+id+'"';}return;}
    attrs+=' '+n+'="'+escA(interp(a.value,scope))+'"';
  });
  out='<'+tag+attrs+'>';
  if(VOID[tag])return out;
  Array.prototype.forEach.call(node.childNodes,function(k){out+=walk(k,scope);});

}

});
